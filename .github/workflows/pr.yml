name: PR checks

# Until this existed, `.github/workflows/` held only tag-triggered release
# automation — nothing looked at a pull request at all. The mobile init-crash
# gate (issue #221) shipped inside `npm run lint`, which meant it protected
# exactly the people who happened to run a local build. This runs it on every PR
# so the gate is real for contributors too.

on:
  pull_request:
  # Also run on pushes to the default branch, so the same checks cover anything
  # that lands without a PR.
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # 22.x, not the 20.19.0 the release workflow pins: the test suite
          # uses the global WebSocket (tests/unit/*RealtimeVoiceSession, the
          # realtimeVoice services), which Node only exposes globally from 21.
          # On 20 these suites die with `ReferenceError: WebSocket is not
          # defined` - which is what the first PR run of this workflow found.
          node-version: '22.x'
          cache: npm

      # `npm run lint` chains `lint:mobile`, which shells out to the Python 3
      # reachability checker in .skills/nexus-mobile-compat/scripts/. Without a
      # Python 3 on PATH that step exits 1 and the whole lint fails, so the
      # interpreter is provisioned explicitly rather than assumed from the
      # runner image.
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + mobile reachability gate)
        run: npm run lint

      - name: Test
        run: npm test
